# Local default: file-backed H2 so a restart keeps accounts and maps.
# ./data/ is gitignored. Start the process from the repository root.
# Override with SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME,
# SPRING_DATASOURCE_PASSWORD, SPRING_DATASOURCE_DRIVER_CLASS_NAME,
# SPRING_JPA_DATABASE_PLATFORM, SPRING_JPA_HIBERNATE_DDL_AUTO, or SERVER_PORT.
# For a deployed database, set SPRING_PROFILES_ACTIVE=prod (see application-prod.properties).
# Do not write ${SPRING_DATASOURCE_URL:...} in this file. That name is the same
# property, the placeholder resolves empty, and Boot then opens an in-memory database.

server.port=8888
server.error.include-stacktrace=never
server.error.include-exception=false

spring.jpa.open-in-view=false

spring.datasource.url=jdbc:h2:file:./data/storymap;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 console is for this machine only.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
