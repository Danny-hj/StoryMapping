# Deployed runtime. SPRING_DATASOURCE_URL / USERNAME / PASSWORD override this file.
# DB_URL is only the fallback when SPRING_DATASOURCE_URL is absent, so startup
# fails instead of opening an embedded database. The H2 console stays off.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.h2.console.enabled=false
spring.h2.console.settings.web-allow-others=false
